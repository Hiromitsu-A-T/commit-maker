name: Weekly Patch Publish
on:
  schedule:
    - cron: "15 0 * * 1"
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  prepare:
    name: Prepare patch for maintainer review
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare candidate without publication authority
        run: |
          MINOR=$(node -p "require('./package.json').version.split('.')[1]")
          if (( MINOR % 2 != 0 )); then exit 0; fi
          npm version patch --no-git-tag-version --no-commit-hooks
          npm run update:badges
          npm run compile
          npm test
          git diff --binary > weekly-patch.diff
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: weekly-patch-review
          path: weekly-patch.diff
          if-no-files-found: ignore

name: Recover verified release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ea580989a381f515a109da2190ad036e388560e3
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: 12558350853
          run-id: 40088820004
          github-token: ${{ github.token }}
          path: vsix
          merge-multiple: true
      - name: Verify previously reviewed artifact
        run: echo '3e8c76345d7ac4f1e6b5fb9e7b584b1d49a38304ba94c743729b3e028e9d870b  vsix/commit-maker-0.18.8.vsix' | sha256sum --check --strict
      - name: Publish exact verified VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          test -n "$VSCE_PAT" && test -n "$OVSX_PAT"
          node_modules/.bin/vsce publish --packagePath vsix/commit-maker-0.18.8.vsix --skip-duplicate
          node_modules/.bin/ovsx publish vsix/commit-maker-0.18.8.vsix --skip-duplicate

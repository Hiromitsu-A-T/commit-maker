name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check commit email metadata
        run: npm run check:commit-emails

      - name: Lint
        run: npm run lint

      - name: Typecheck all maintained TypeScript
        run: npm run typecheck

      - name: Build webview helpers
        run: npm run build:media

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Isolated integration test
        run: npm run test:integration

      - name: Audit
        run: npm audit --audit-level=moderate

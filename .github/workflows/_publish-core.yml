name: Publish Extension Core
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      pre_release:
        required: true
        type: boolean
    secrets:
      VSCE_PAT:
        required: true
      OVSX_PAT:
        required: true
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Validate approved source, channel and version
        id: metadata
        env:
          CHANNEL: ${{ inputs.channel }}
          PRE_RELEASE: ${{ inputs.pre_release }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          MINOR=$(node -p "require('./package.json').version.split('.')[1]")
          git merge-base --is-ancestor HEAD origin/main
          if [ "$CHANNEL" = stable ]; then
            [ "$PRE_RELEASE" = false ]
            [ "$GITHUB_REF_TYPE" = tag ]
            [ "$GITHUB_REF_NAME" = "v$VERSION" ]
            (( MINOR % 2 == 0 )) || exit 1
          elif [ "$CHANNEL" = preview ]; then
            [ "$PRE_RELEASE" = true ]
            [ "$GITHUB_REF" = refs/heads/main ]
            (( MINOR % 2 != 0 )) || exit 1
          else
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  local-runtime-smoke:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run smoke:local:runtime
  build:
    needs: [validate, local-runtime-smoke]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.package.outputs.digest }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck
      - run: npm run compile && npm run build:media
      - run: npm test && npm run test:integration
      - run: npm audit --audit-level=moderate
      - name: Package verified source
        id: package
        env:
          PRE_RELEASE: ${{ inputs.pre_release }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          npm run build:nls
          trap 'npm run clean:nls' EXIT
          ARGS=(--no-dependencies --no-rewrite-relative-links)
          if [ "$PRE_RELEASE" = true ]; then ARGS+=(--pre-release); fi
          node_modules/.bin/vsce package "${ARGS[@]}"
          mkdir -p vsix
          mv "commit-maker-$VERSION.vsix" vsix/
          echo "digest=$(sha256sum "vsix/commit-maker-$VERSION.vsix" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        with:
          name: commit-maker-${{ inputs.channel }}-vsix
          path: vsix/*.vsix
  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install locked publisher tooling without lifecycle scripts
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: vsix
          merge-multiple: true
      - name: Verify immutable build artifact
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: echo "$EXPECTED_DIGEST  vsix/commit-maker-$VERSION.vsix" | sha256sum --check --strict
      - name: Publish verified VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PRE_RELEASE: ${{ inputs.pre_release }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VSCE_PAT" && test -n "$OVSX_PAT"
          ARGS=(--packagePath "vsix/commit-maker-$VERSION.vsix" --skip-duplicate)
          OVSX_ARGS=("vsix/commit-maker-$VERSION.vsix" --skip-duplicate)
          if [ "$PRE_RELEASE" = true ]; then ARGS+=(--pre-release); OVSX_ARGS+=(--pre-release); fi
          node_modules/.bin/vsce publish "${ARGS[@]}"
          node_modules/.bin/ovsx publish "${OVSX_ARGS[@]}"

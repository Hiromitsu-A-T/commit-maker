name: Migrate release secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Seal existing secrets for the release Environment
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          python3 - <<'PY'
          import base64, ctypes, ctypes.util, json, os
          sodium = ctypes.CDLL(ctypes.util.find_library('sodium'))
          sodium.sodium_init()
          key = base64.b64decode('IArunftal/7E9CR/St6dESQX+QeEmW0MAwDds+FSTTg=')
          output = {}
          for name in ['VSCE_PAT', 'OVSX_PAT']:
              value = os.environ[name].encode()
              if not value:
                  raise RuntimeError('Required secret is missing')
              sealed = ctypes.create_string_buffer(len(value) + 48)
              if sodium.crypto_box_seal(sealed, value, ctypes.c_ulonglong(len(value)), key) != 0:
                  raise RuntimeError('Encryption failed')
              output[name] = base64.b64encode(sealed.raw).decode()
          with open(os.environ['RUNNER_TEMP'] + '/sealed-secrets.json', 'w') as f:
              json.dump(output, f)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sealed-release-secrets
          path: ${{ runner.temp }}/sealed-secrets.json
          retention-days: 1
